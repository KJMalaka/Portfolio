<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="bb-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0f1e"/>
  <rect width="800" height="450" fill="url(#bb-accent)" opacity="0.03"/>

  <text x="24" y="30" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="1">BATHOBANK — LAYERED ARCHITECTURE</text>

  <!-- Client -->
  <rect x="24" y="46" width="752" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="400" y="67" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">React Client — Customer &amp; Admin Portals</text>

  <!-- arrow -->
  <line x1="400" y1="80" x2="400" y2="98" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,104 395,95 405,95" fill="#5eead4"/>
  <text x="415" y="94" fill="#64748b" font-size="10">HTTPS / REST (JSON)</text>

  <!-- Controller -->
  <rect x="24" y="106" width="752" height="34" rx="8" fill="#0f2942" stroke="#3b82f6"/>
  <text x="400" y="127" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Controller — REST endpoints, request validation</text>

  <line x1="400" y1="140" x2="400" y2="158" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,164 395,155 405,155" fill="#5eead4"/>

  <!-- Service -->
  <rect x="24" y="166" width="752" height="34" rx="8" fill="#1e1b3a" stroke="#a855f7"/>
  <text x="400" y="187" fill="#d8b4fe" font-size="13" font-weight="700" text-anchor="middle">Service — business rules, transfer orchestration &amp; rollback</text>

  <line x1="400" y1="200" x2="400" y2="218" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,224 395,215 405,215" fill="#5eead4"/>

  <!-- Factory -->
  <rect x="24" y="226" width="752" height="34" rx="8" fill="#20243a" stroke="#64748b"/>
  <text x="400" y="247" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">Factory — constructs domain entities from validated DTOs</text>

  <line x1="400" y1="260" x2="400" y2="278" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,284 395,275 405,275" fill="#5eead4"/>

  <!-- Repository -->
  <rect x="24" y="286" width="752" height="34" rx="8" fill="#0f2942" stroke="#3b82f6"/>
  <text x="400" y="307" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Repository — Spring Data JPA</text>

  <line x1="400" y1="320" x2="400" y2="338" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,344 395,335 405,335" fill="#5eead4"/>

  <!-- DB -->
  <rect x="24" y="346" width="752" height="34" rx="8" fill="#0c1a12" stroke="#14b8a6"/>
  <text x="400" y="367" fill="#5eead4" font-size="13" font-weight="700" text-anchor="middle">MySQL — Customers · Accounts · Transactions · Cards · Branches · Beneficiaries · KYC Docs</text>

  <!-- Side notes -->
  <rect x="24" y="396" width="366" height="40" rx="8" fill="#111827" stroke="#334155"/>
  <text x="38" y="413" fill="#94a3b8" font-size="10" font-weight="700">ATOMIC TRANSFERS</text>
  <text x="38" y="427" fill="#64748b" font-size="9.5">2 linked transaction records · rolled back together on failure</text>

  <rect x="410" y="396" width="366" height="40" rx="8" fill="#111827" stroke="#334155"/>
  <text x="424" y="413" fill="#94a3b8" font-size="10" font-weight="700">TEST COVERAGE</text>
  <text x="424" y="427" fill="#64748b" font-size="9.5">JUnit 5 across all four layers — Controller through Repository</text>
</svg>
