<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="ik-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0f1e"/>
  <rect width="800" height="450" fill="url(#ik-accent)" opacity="0.03"/>

  <text x="24" y="30" fill="#fdba74" font-size="11" font-weight="700" letter-spacing="1">IKHONO AI — LIVE-GROUNDED ROADMAP PIPELINE</text>

  <!-- Client -->
  <rect x="24" y="50" width="752" height="40" rx="8" fill="#111827" stroke="#334155"/>
  <text x="400" y="75" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">React / Vite Client — describes a skill + income goal</text>

  <line x1="400" y1="90" x2="400" y2="108" stroke="#fdba74" stroke-width="2"/>
  <polygon points="400,114 395,105 405,105" fill="#fdba74"/>

  <!-- FastAPI -->
  <rect x="24" y="116" width="752" height="40" rx="8" fill="#0f2942" stroke="#3b82f6"/>
  <text x="400" y="141" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">FastAPI Backend — classifies skill &amp; stage</text>

  <line x1="300" y1="156" x2="220" y2="182" stroke="#fdba74" stroke-width="2"/>
  <line x1="500" y1="156" x2="580" y2="182" stroke="#fdba74" stroke-width="2"/>

  <!-- Two parallel services -->
  <rect x="60" y="184" width="320" height="56" rx="8" fill="#1e1b3a" stroke="#a855f7"/>
  <text x="220" y="208" fill="#d8b4fe" font-size="12" font-weight="700" text-anchor="middle">Groq LLM</text>
  <text x="220" y="225" fill="#64748b" font-size="9.5" text-anchor="middle">Classifies stage, ranks &amp; drafts steps</text>

  <rect x="420" y="184" width="320" height="56" rx="8" fill="#20243a" stroke="#f59e0b"/>
  <text x="580" y="208" fill="#fdba74" font-size="12" font-weight="700" text-anchor="middle">Tavily Live Web Search</text>
  <text x="580" y="225" fill="#64748b" font-size="9.5" text-anchor="middle">Grounds each step in a current source</text>

  <line x1="220" y1="240" x2="360" y2="266" stroke="#fdba74" stroke-width="2"/>
  <line x1="580" y1="240" x2="440" y2="266" stroke="#fdba74" stroke-width="2"/>
  <polygon points="400,280 391,264 409,264" fill="#fdba74"/>

  <!-- Merge -->
  <rect x="220" y="282" width="360" height="44" rx="8" fill="#111827" stroke="#334155"/>
  <text x="400" y="308" fill="#e2e8f0" font-size="12" font-weight="700" text-anchor="middle">Source-noted roadmap, ranked by stage</text>

  <line x1="400" y1="326" x2="400" y2="346" stroke="#fdba74" stroke-width="2"/>
  <polygon points="400,352 395,343 405,343" fill="#fdba74"/>

  <!-- Supabase -->
  <rect x="250" y="354" width="300" height="44" rx="8" fill="#0c1a12" stroke="#14b8a6"/>
  <text x="400" y="380" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">Supabase — auth + Row Level Security</text>

  <rect x="24" y="410" width="752" height="34" rx="8" fill="#111827" stroke="#334155"/>
  <text x="38" y="431" fill="#64748b" font-size="9.5">Why RLS from day one: roadmaps are personal — one user's plan must never be visible to another by default, not by convention.</text>
</svg>
