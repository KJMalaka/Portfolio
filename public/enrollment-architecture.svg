<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="es-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0f1e"/>
  <rect width="800" height="450" fill="url(#es-accent)" opacity="0.03"/>

  <text x="24" y="30" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="1">STUDENT ENROLLMENT SYSTEM — CLIENT-SERVER ARCHITECTURE</text>

  <!-- Two clients -->
  <rect x="24" y="54" width="360" height="60" rx="8" fill="#111827" stroke="#334155"/>
  <text x="204" y="80" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Student Client</text>
  <text x="204" y="98" fill="#64748b" font-size="10" text-anchor="middle">Self-enrolls in available courses</text>

  <rect x="416" y="54" width="360" height="60" rx="8" fill="#111827" stroke="#334155"/>
  <text x="596" y="80" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Admin Client</text>
  <text x="596" y="98" fill="#64748b" font-size="10" text-anchor="middle">Adds / removes students from course rosters</text>

  <!-- arrows converging -->
  <line x1="204" y1="114" x2="360" y2="150" stroke="#5eead4" stroke-width="2"/>
  <line x1="596" y1="114" x2="440" y2="150" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,164 391,148 409,148" fill="#5eead4"/>
  <text x="400" y="135" fill="#64748b" font-size="9.5" text-anchor="middle">Socket / RMI request</text>

  <!-- Server -->
  <rect x="200" y="166" width="400" height="50" rx="8" fill="#0f2942" stroke="#3b82f6"/>
  <text x="400" y="187" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Java Server</text>
  <text x="400" y="204" fill="#64748b" font-size="10" text-anchor="middle">Object-oriented request handling, role-based rules</text>

  <line x1="400" y1="216" x2="400" y2="240" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,246 395,237 405,237" fill="#5eead4"/>
  <text x="415" y="234" fill="#64748b" font-size="9.5">JDBC</text>

  <!-- DAO layer -->
  <rect x="250" y="248" width="300" height="42" rx="8" fill="#20243a" stroke="#64748b"/>
  <text x="400" y="274" fill="#cbd5e1" font-size="12" font-weight="700" text-anchor="middle">Data Access Layer (JDBC)</text>

  <line x1="400" y1="290" x2="400" y2="312" stroke="#5eead4" stroke-width="2"/>
  <polygon points="400,318 395,309 405,309" fill="#5eead4"/>

  <!-- DB -->
  <rect x="280" y="320" width="240" height="42" rx="8" fill="#0c1a12" stroke="#14b8a6"/>
  <text x="400" y="346" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">Relational Database</text>

  <!-- Notes -->
  <rect x="24" y="384" width="752" height="50" rx="8" fill="#111827" stroke="#334155"/>
  <text x="38" y="403" fill="#94a3b8" font-size="10" font-weight="700">DESIGN</text>
  <text x="38" y="419" fill="#64748b" font-size="9.5">Clean separation between client and server tiers · object-oriented domain model · Maven build pipeline</text>
</svg>
