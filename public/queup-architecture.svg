<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="qu-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#0a0f1e"/>
  <rect width="800" height="450" fill="url(#qu-accent)" opacity="0.03"/>

  <text x="24" y="30" fill="#f0abfc" font-size="11" font-weight="700" letter-spacing="1">QUEUP — REAL-TIME QUEUE ARCHITECTURE</text>

  <!-- Two clients -->
  <rect x="24" y="54" width="360" height="56" rx="8" fill="#111827" stroke="#334155"/>
  <text x="204" y="80" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Citizen Client (React)</text>
  <text x="204" y="97" fill="#64748b" font-size="10" text-anchor="middle">Join a queue, watch live position</text>

  <rect x="416" y="54" width="360" height="56" rx="8" fill="#111827" stroke="#334155"/>
  <text x="596" y="80" fill="#e2e8f0" font-size="13" font-weight="700" text-anchor="middle">Admin Client (React)</text>
  <text x="596" y="97" fill="#64748b" font-size="10" text-anchor="middle">Manage the line, close/open queues</text>

  <line x1="204" y1="110" x2="360" y2="146" stroke="#f0abfc" stroke-width="2"/>
  <line x1="596" y1="110" x2="440" y2="146" stroke="#f0abfc" stroke-width="2"/>
  <polygon points="400,160 391,144 409,144" fill="#f0abfc"/>
  <text x="400" y="132" fill="#64748b" font-size="9.5" text-anchor="middle">WebSocket (live) + REST (actions)</text>

  <!-- Server -->
  <rect x="180" y="162" width="440" height="50" rx="8" fill="#0f2942" stroke="#3b82f6"/>
  <text x="400" y="183" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Node.js / Express API</text>
  <text x="400" y="200" fill="#64748b" font-size="10" text-anchor="middle">Single source of truth — pushes state, doesn't wait for polling</text>

  <line x1="400" y1="212" x2="400" y2="236" stroke="#f0abfc" stroke-width="2"/>
  <polygon points="400,242 395,233 405,233" fill="#f0abfc"/>
  <text x="415" y="230" fill="#64748b" font-size="9.5">SQL, unique constraints</text>

  <!-- DB -->
  <rect x="250" y="244" width="300" height="46" rx="8" fill="#0c1a12" stroke="#14b8a6"/>
  <text x="400" y="266" fill="#5eead4" font-size="12" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="400" y="282" fill="#64748b" font-size="9.5" text-anchor="middle">Queue position · role · notification state</text>

  <!-- Notes -->
  <rect x="24" y="310" width="752" height="46" rx="8" fill="#111827" stroke="#334155"/>
  <text x="38" y="329" fill="#94a3b8" font-size="10" font-weight="700">WHY POSTGRES, NOT A DOCUMENT STORE</text>
  <text x="38" y="345" fill="#64748b" font-size="9.5">Losing someone's place in a government queue isn't an acceptable edge case — relational integrity was non-negotiable.</text>

  <rect x="24" y="366" width="752" height="46" rx="8" fill="#111827" stroke="#334155"/>
  <text x="38" y="385" fill="#94a3b8" font-size="10" font-weight="700">CONCURRENCY</text>
  <text x="38" y="401" fill="#64748b" font-size="9.5">Slot-claiming pushed down to a DB-level uniqueness constraint — application-level checks don't hold up under concurrent requests.</text>
</svg>
