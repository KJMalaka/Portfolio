<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Katlego Malaka</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0f1e;
      color: white;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: #3b82f6; top: 10%; left: 10%; animation: drift 9s ease-in-out infinite; }
    .blob-2 { width: 350px; height: 350px; background: #a855f7; bottom: 10%; right: 10%; animation: drift 7s ease-in-out infinite reverse; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.08); }
    }
    .container { position: relative; z-index: 1; max-width: 520px; padding: 2rem; }
    .code {
      font-size: clamp(5rem, 20vw, 7rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #60a5fa, #a855f7, #ec4899);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
      margin-bottom: 1rem;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.75rem; }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 1rem;
      line-height: 1.6;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2.2rem;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border-radius: 0.875rem;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
    }
    .btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .terminal {
      display: inline-block;
      margin-top: 2.5rem;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 0.8rem;
      color: #3b82f6;
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 0.5rem;
      padding: 0.5rem 1rem;
      letter-spacing: 0.02em;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: #3b82f6;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="container">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>
      This route doesn't exist — but the engineer who built this site
      handles edge cases for a living.
    </p>
    <a href="/" class="btn">← Back to portfolio</a>
    <div class="terminal">
      $ cd / &amp;&amp; ./katlego.dev<span class="cursor"></span>
    </div>
  </div>
</body>
</html>
